name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tooling
        run: |
          python -m pip install ruff==0.16.5 basedpyright==1.40.2
          curl -fsSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          sudo install shfmt /usr/local/bin/

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Basedpyright
        run: |
          mkdir .pycheck
          for f in bin/*; do [ "$f" = bin/webshot ] || cp "$f" ".pycheck/${f#bin/}.py"; done
          basedpyright --warnings .pycheck tests

      - name: Shell
        run: |
          shellcheck install
          shfmt -d -i 4 -ci -bn install

      - name: Prettier
        run: |
          npx --yes prettier@3.9.6 --check .
          npx --yes prettier@3.9.6 --check --parser babel bin/webshot

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Unit tests
        run: python -m unittest discover -s tests -v
